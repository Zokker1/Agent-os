<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title description"><title id="title">Agent OS:n arkkitehtuuri</title><desc id="description">Käyttöliittymä käyttää paikallista APIa. Rust-taustapalvelu yhdistää agenttimoottorin, mallipalvelut, käyttöoikeudet, työkalut ja paikallisen tallennuksen. Jatkokehitys on merkitty katkoviivalla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64728b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#202d45}.label{font-size:20px;font-weight:650}.body{font-size:15px}.eyebrow{font-size:13px;letter-spacing:2px;fill:#5075ce}.title{font-size:34px;font-weight:700}.note{font-size:16px;fill:#63708a}</style><rect width="1440" height="970" fill="#fcfdff"/><text x="60" y="44" class="eyebrow">OMA PROJEKTI · KEHITYSVERSIO</text><text x="60" y="91" class="title">Agent OS — paikallinen agenttityötila</text><text x="60" y="927" class="note">Arkkitehtuurin tiivistelmä · 8.10.2026 · yksittäinen koeajo ei todenna koko tiekarttaa</text><path d="M720 230 V275" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M720 365 V410" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M720 505 V529 H240 V555" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M720 505 V555" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M720 505 V529 H1200 V555" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M420 615 H540" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M900 615 H1020" fill="none" stroke="#64728b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M240 675 V735" fill="none" stroke="#be773c" stroke-width="2"  marker-end="url(#arrow)"/><path d="M720 675 V735" fill="none" stroke="#378168" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1200 675 V735" fill="none" stroke="#9b9ca9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g><rect x="455" y="135" width="530" height="95" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="477" y="167" class="label">Yhteinen käyttöliittymä</text><text x="477" y="194" class="body">React + TypeScript · keskustelu, ajot, asetukset</text><text x="477" y="215" class="body">Selain sekä Tauri-työpöytäkuori</text></g><g><rect x="455" y="275" width="530" height="90" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="477" y="307" class="label">Paikallinen rajapinta</text><text x="477" y="334" class="body">Loopback HTTP API · tapahtumien välitys</text><text x="477" y="355" class="body">Käyttöliittymä kutsuu taustapalvelua</text></g><g><rect x="455" y="410" width="530" height="95" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="477" y="442" class="label">Rust-taustapalvelu</text><text x="477" y="469" class="body">Yksi prosessi: API, sovelluspalvelut ja ajastus</text><text x="477" y="490" class="body">Yhdistää mallin, työkalut ja pysyvän tilan</text></g><g><rect x="60" y="555" width="360" height="120" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="82" y="587" class="label">Agenttimoottori</text><text x="82" y="614" class="body">Malli → työkalukutsu → tulos → malli</text><text x="82" y="635" class="body">Konteksti, ajon ohjaus ja rajat</text><text x="82" y="656" class="body">Jatkaminen tallennetusta tilasta</text></g><g><rect x="540" y="555" width="360" height="120" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="562" y="587" class="label">Käyttöoikeudet ja hyväksynnät</text><text x="562" y="614" class="body">Päätös tarkistetaan mallin ulkopuolella</text><text x="562" y="635" class="body">Kirjoitukset odottavat hyväksyntää</text><text x="562" y="656" class="body">Toimien aikomukset ja tulokset kirjataan</text></g><g><rect x="1020" y="555" width="360" height="120" rx="14" fill="#eef4ff" stroke="#5075ce" stroke-width="1.5" /><text x="1042" y="587" class="label">Työkalujen suoritus</text><text x="1042" y="614" class="body">Tiedostojen luku, haku ja muokkaus</text><text x="1042" y="635" class="body">Git ja paikalliset komennot</text><text x="1042" y="656" class="body">Tulokset palaavat agenttimoottorille</text></g><g><rect x="60" y="735" width="360" height="115" rx="14" fill="#fff3e8" stroke="#be773c" stroke-width="1.5" /><text x="82" y="767" class="label">Mallipalvelut</text><text x="82" y="794" class="body">Provider-sovittimet erillään ydinsilmukasta</text><text x="82" y="815" class="body">Koeajo: OpenRouter → DeepSeek</text><text x="82" y="836" class="body">Valittu pilvimalli saa sille lähetetyn kontekstin</text></g><g><rect x="540" y="735" width="360" height="115" rx="14" fill="#edf8f3" stroke="#378168" stroke-width="1.5" /><text x="562" y="767" class="label">Paikallinen tallennus</text><text x="562" y="794" class="body">SQLite · keskustelut, ajot ja tapahtumat</text><text x="562" y="815" class="body">Tiedostot · raportit ja muut tuotokset</text><text x="562" y="836" class="body">API-avaimen arvoa ei palauteta selaimelle</text></g><g><rect x="1020" y="735" width="360" height="115" rx="14" fill="#f4f4f7" stroke="#9b9ca9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1042" y="767" class="label">Jatkokehityksen suunta</text><text x="1042" y="794" class="body">Laaja aliagenttiohjaus · MCP-laajennukset</text><text x="1042" y="815" class="body">Selain- ja työpöytätyöntekijät</text><text x="1042" y="836" class="body">Toteutusaste ja kytkennät vaihtelevat</text></g></svg>